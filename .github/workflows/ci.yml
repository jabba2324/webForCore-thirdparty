# Builds the libraries against webForCore's released packages, packs them, and runs tools/smoke (an application on
# both repositories' packages), on Linux and on Windows; a release needs both. A version tag (v0.4.0, matching <Version> in Directory.Build.props) also publishes the
# packages as a GitHub release and rebuilds the NuGet feed on GitHub Pages (feed.yml).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  OPENSSL_ENABLE_SHA1_SIGNATURES: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      webforcore: ${{ steps.version.outputs.webforcore }}

    steps:
      # AjaxControlToolkit's source is a submodule (external/, xforcore/webForCore#61).
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The release version from Directory.Build.props; any other run builds a prerelease of it (0.4.0-ci.12).
      - name: Version
        id: version
        run: |
          base=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/v}" != "$base" ]]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match <Version>$base</Version> in Directory.Build.props"; exit 1
            fi
            version=$base
          else
            version=$base-ci.$GITHUB_RUN_NUMBER
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "webforcore=$(sed -n 's#.*<WebForCoreVersion[^>]*>\(.*\)</WebForCoreVersion>.*#\1#p' Directory.Build.props)" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core libfontconfig1

      - name: webForCore's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch-webforcore.sh ${{ steps.version.outputs.webforcore }}

      - name: Build
        run: dotnet build webForCore-thirdparty.slnx -c Release -nodeReuse:false -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: tools/pack.sh ${{ steps.version.outputs.version }}

      - name: Smoke test
        run: tools/smoke.sh ${{ steps.version.outputs.version }} ${{ steps.version.outputs.webforcore }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  # The same on Windows (Git Bash), as webForCore's and drawingForCore's CI do: applications are developed there too.
  build-windows:
    needs: build-and-test
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      # Check files out as they are stored, as on Linux: core.autocrlf would give the shell scripts CRLF line endings.
      - name: Line endings
        run: git config --global core.autocrlf false

      - name: Long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx

      - name: webForCore's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch-webforcore.sh ${{ needs.build-and-test.outputs.webforcore }}

      - name: Build
        run: dotnet build webForCore-thirdparty.slnx -c Release -nodeReuse:false -p:Version=${{ needs.build-and-test.outputs.version }}

      - name: Pack
        run: tools/pack.sh ${{ needs.build-and-test.outputs.version }}

      - name: Smoke test
        run: tools/smoke.sh ${{ needs.build-and-test.outputs.version }} ${{ needs.build-and-test.outputs.webforcore }}

  release:
    needs: [build-and-test, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/release-notes

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
          WEBFORCORE: ${{ needs.build-and-test.outputs.webforcore }}
        run: |
          cat > notes.md <<NOTES
          webForCore-thirdparty $VERSION as NuGet packages, built against webForCore $WEBFORCORE, on the feed
          https://xforcore.github.io/webForCore-thirdparty/index.json (not on nuget.org). Add it to your nuget.config next
          to webForCore's and drawingForCore's feeds, and reference the packages next to \`webForCore\`. See the README.

              <add key="webForCore-thirdparty" value="https://xforcore.github.io/webForCore-thirdparty/index.json" />
          NOTES
          if [ -f "docs/release-notes/$VERSION.md" ]; then printf '\n' >> notes.md; cat "docs/release-notes/$VERSION.md" >> notes.md; fi
          gh release create "$GITHUB_REF_NAME" packages/*.nupkg packages/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --title "webForCore-thirdparty $VERSION" --notes-file notes.md --verify-tag

  # The NuGet feed on GitHub Pages, rebuilt from the latest releases (a release made with GITHUB_TOKEN doesn't start
  # other workflows, so it is called from here).
  feed:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/feed.yml
